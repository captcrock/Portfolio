    <template id="t-intro">
      <p>Hola — soy <strong>Adam Crocker</strong>. Ingeniero IA en la Nube, AWS Solutions Architect — Professional (enero 2025, válido hasta enero 2028). Basado en <strong>Springville, Alabama</strong>; trabajo remoto desde cualquier lugar.</p>
      <p>Hoy ocupo dos puestos: <strong>Ingeniero de Datos en el equipo ODSR de Delta Air Lines</strong> (en junio de 2026 paso al <strong>equipo de Habilitación de IA</strong> de Delta) e <strong>Ingeniero de Sistemas en Diversified Gas &amp; Oil</strong> desde agosto de 2025. En paralelo dirijo <strong>That Simple Tech</strong> — mi consultora nativa de IA.</p>
      <p>La versión corta de lo que hago: <em>construyo sistemas nativos de IA para empresas de todos los tamaños</em>. Desde Fortune 500 hasta el negocio de la esquina. La misma persona, el mismo cuidado.</p>
      <div class="msg-actions">
        <button class="chip" data-prompt="¿Qué has lanzado?">▸ ¿Qué has lanzado?</button>
        <button class="chip" data-prompt="Cuéntame sobre tu trabajo en Delta">▸ Cuéntame sobre Delta</button>

      <p>Seis piezas que le mostraría a un ingeniero responsable de contratar — formatos distintos, todas en producción:</p>

      <div class="card">

        <div class="card-meta">1,6 M+ registros/día · 114 funciones PL/pgSQL · 15/77 esquemas/tablas</div>

    <template id="t-delta">
      <p>Estoy en Delta desde 2021. Dos etapas:</p>
      <p><strong>2021–23: Desarrollador de Software Asociado.</strong> La primera mitad de carrera — POC de Reportes Ejecutivos con IA, trabajo de CI/CD sobre AWS Glue, automatización STS SSO en bash puro (sorteando Windows Defender y las restricciones de admin de la flota corporativa).</p>
      <p><strong>2023–presente: Ingeniero de Datos en el equipo de Operations Strategy Reporting (ODSR).</strong> El trabajo por el que más se me conoce internamente: <em>Modernización de Reportes v2</em>. Los scorecards SCRD / ESR / MPR eran enormes monolitos de PPTX / HTML — lideré el reemplazo hacia un stack JSON-first sobre servicios nativos de AWS (Glue, Step Functions, DynamoDB, S3, API Gateway, Bedrock), con Claude Haiku 4.5 generando narrativas automáticas y explicaciones por KPI.</p>
      <p>La restricción era real: frontera IAM <code>delegate-admin-</code> más un SCP que bloqueaba crear funciones Lambda nuevas. El cómputo de IA lo entregué como un <strong>Glue Python-shell job</strong> con empaquetado boto3 personalizado, así no hizo falta excepción de arquitectura.</p>
      <p><strong>Junio 2026: seleccionado para el equipo de Habilitación de IA de Delta.</strong> Estándares de agentes IA cruzando Planeación y Performance de Operaciones. Ese es el próximo capítulo.</p>
      <div class="msg-actions">
        <button class="chip" data-prompt="¿Qué es SCRD?">▸ ¿Qué es SCRD?</button>

    <template id="t-scrd">
      <p>SCRD = Scorecard. Es un tablero operacional interno de Delta. La v1 corría como un PPTX generado con diapositivas por unidad de negocio; la v2 es un paquete de datos JSON-first más un único visor vanilla-JS con Chart.js. El logro no fue solo el renderer — fue lograr que un solo empaquetador maneje <strong>~2.300 entidades organizacionales por cierre mensual</strong>, con un frontend tan compacto que los compañeros más orientados a Python pueden mantenerlo.</p>
      <p>ESR (Executive Strategy Reporting) y MPR (Monthly Performance Reporting) corren hoy sobre el mismo pipeline.</p>
    </template>

    <template id="t-eval">
      <p>Mientras revisaba el código heredado de SCRD encontré un motor de plantillas que usaba <code>eval()</code> sobre cadenas provistas por operadores — un vector de inyección por plantilla escondido a plena vista. Lo cerré como parte de la migración v2 junto con otros seis defectos latentes (el peor: columnas de año y mes intercambiadas en uno de los rollups, lo que clasificaba mal cierres en silencio).</p>
      <p>Total: siete defectos cerrados durante la modernización, todos con pasos de reproducción en los 13 documentos técnicos.</p>
    </template>

    <template id="t-dgo">
      <p>Entré a <strong>Diversified Gas &amp; Oil</strong> como Ingeniero de Sistemas en <strong>agosto de 2025</strong>, en paralelo con Delta. Tres sistemas centrales bajo mi cargo:</p>
      <ol class="num-list">
        <li><strong>Corporate Historian</strong> — la plataforma central de datos OT. TimescaleDB, 1,6 M+ registros de producción diarios. Soy el ingeniero principal.</li>
        <li><strong>Historian ML</strong> — detección de anomalías sobre 186 M+ observaciones de telemetría. Isolation Forest + Random Forest + LSTM, sobre SageMaker vía CDK.</li>
        <li><strong>Field App</strong> — app offline-first de inspección de tanques en Ionic 8 + Angular 20 + Capacitor, que reemplaza formularios en papel en toda la operación de campo.</li>
      </ol>
      <p>Y algo adyacente, más pequeño: <strong>CI/CD para Migración de BD Híbrida</strong> — un pipeline de 5 etapas en Azure DevOps que clasifica cada cambio de esquema contra ~30 patrones regex de riesgo y controla los gates correspondientes. Auditoría alineada con SOX.</p>
    </template>

    <template id="t-tst">
      <p><strong>That Simple Tech (TST)</strong> es mi consultora tecnológica nativa de IA. Operador y dueño único. El producto estrella es la <strong>Plataforma Autónoma de Agencia IA</strong> — un sistema de 10 agentes que maneja el ciclo completo del cliente en proyectos para pequeñas empresas:</p>
      <p class="role-list">
        captación · ventas · alcance · construcción · QA · despliegue · soporte · facturación · comunicaciones · voz
      </p>
      <p>Decisiones de arquitectura que conviene resaltar:</p>
      <ul>
        <li><strong>MiniMax M2.7</strong> como cerebro principal — 100% de uso de herramientas, ~3,3× más barato y ~2,5× más rápido que la ruta equivalente con la API de Claude</li>
        <li><strong>Gemini 3 Flash Preview</strong> para QA visual</li>
        <li><strong>Pipecat + Telnyx + Deepgram Nova</strong> para el pipeline de voz</li>
        <li>Sandboxes de <strong>Cua</strong> para ejecución de agentes</li>
        <li><strong>SvelteKit sobre Vercel</strong> para el portal de cliente, con una cola unificada de revisiones (portal / correo / SMS / teléfono entran a un solo buzón)</li>
        <li><strong>Qwen Code en OpenRouter</strong> como entorno de desarrollo</li>
      </ul>
      <p>Los portales nunca exponen terminología de IA — para el cliente se ve simplemente como una agencia muy rápida. Hay un control de revisión humana (PENDING_REVIEW) sobre todo lo que se entrega al cliente.</p>
