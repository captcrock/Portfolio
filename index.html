<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Adam Crocker — Spatial Portfolio</title>
    <meta name="description" content="Adam Crocker's portfolio as a 3D spatial gallery. Drag to orbit, click any monolith to inspect a project." />
    <meta name="theme-color" content="#06060c" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://crockerjadam.com/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <!-- ===== LOADING ===== -->
    <div class="loading" id="loading">
      <div class="loading-mark"></div>
      <div class="loading-text">INITIATING SPATIAL GALLERY</div>
      <div class="loading-bar"><div class="loading-fill"></div></div>
      <div class="loading-status" id="loading-status">Loading geometry…</div>
    </div>

    <!-- ===== CANVAS ===== -->
    <canvas id="canvas"></canvas>

    <!-- ===== HUD ===== -->
    <header class="hud-top">
      <div class="hud-brand">
        <div class="hud-brand-mark"></div>
        <div class="hud-brand-text">
          <div class="hud-name">Adam Crocker</div>
          <div class="hud-role">AI Cloud Engineer · AWS SAP-Pro</div>
        </div>
      </div>
      <div class="hud-actions">
        <button class="hud-btn" id="btn-reset" title="Reset camera">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          <span>Reset</span>
        </button>
        <a class="hud-btn primary" href="/assets/Adam_Crocker_Resume.pdf" download="Adam_Crocker_Resume.pdf">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          <span>Résumé</span>
        </a>
      </div>
    </header>

    <div class="hud-instructions">
      <div class="hi-row"><span class="hi-k">DRAG</span><span class="hi-v">orbit</span></div>
      <div class="hi-row"><span class="hi-k">SCROLL</span><span class="hi-v">zoom</span></div>
      <div class="hi-row"><span class="hi-k">CLICK</span><span class="hi-v">inspect</span></div>
    </div>

    <div class="hud-coords">
      <span id="hud-coords-val">x: 0  y: 0  z: 0</span>
    </div>

    <!-- ===== HOVER TOOLTIP ===== -->
    <div class="hover-card" id="hover-card">
      <span class="hc-num"></span>
      <span class="hc-title"></span>
    </div>

    <!-- ===== PROJECT MODAL ===== -->
    <div class="modal" id="modal" aria-hidden="true">
      <div class="modal-card">
        <button class="modal-close" id="modal-close" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <div class="modal-num"></div>
        <div class="modal-meta">
          <span class="modal-tag"></span>
          <span class="modal-org"></span>
        </div>
        <h2 class="modal-title"></h2>
        <p class="modal-sub"></p>
        <p class="modal-desc"></p>
        <div class="modal-stats"></div>
        <div class="modal-chips"></div>
      </div>
    </div>

    <!-- ===== CONTACT FAB ===== -->
    <div class="contact-fab" id="contact-fab">
      <button class="cf-toggle" id="cf-toggle" aria-label="Contact">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <span>Contact</span>
      </button>
      <div class="cf-panel">
        <a href="mailto:crocker.j.adam@gmail.com" class="cf-row">
          <span class="cf-k">EMAIL</span>
          <span class="cf-v">crocker.j.adam@gmail.com</span>
        </a>
        <a href="tel:+12052761071" class="cf-row">
          <span class="cf-k">PHONE</span>
          <span class="cf-v">(205) 276-1071</span>
        </a>
        <a href="https://linkedin.com/in/adam-crocker1" target="_blank" rel="noopener" class="cf-row">
          <span class="cf-k">LINKEDIN</span>
          <span class="cf-v">adam-crocker1 ↗</span>
        </a>
        <a href="https://github.com/captcrock" target="_blank" rel="noopener" class="cf-row">
          <span class="cf-k">GITHUB</span>
          <span class="cf-v">captcrock ↗</span>
        </a>
      </div>
    </div>

    <!-- Three.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="/assets/main.js" defer></script>
  </body>
</html>
