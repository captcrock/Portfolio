    <template id="t-intro">
      <p>Hey — I'm <strong>Adam Crocker</strong>. AI Cloud Engineer. <strong>AWS Solutions Architect — Professional</strong> (Jan 2025, valid Jan 2028). Based in <strong>Springville, Alabama</strong>; remote anywhere.</p>
      <p>I build <em>AI-native systems for businesses of every size</em> — Fortune 500 down to mom-and-pop shops. Same person, same care. Most of my work sits at the intersection of <strong>LLMs &amp; agents</strong>, <strong>AWS</strong>, and <strong>production data engineering</strong> — and the integration work between them.</p>
      <div class="msg-actions">
        <button class="chip" data-prompt="What have you shipped?">▸ What have you shipped?</button>
        <button class="chip" data-prompt="What's your stack?">▸ What's your stack?</button>
        <button class="chip" data-prompt="Who have you partnered with?">▸ Partners</button>

    <template id="t-work">
      <p>Here are two pieces I'd want a hiring engineer to look at — different shapes, both production:</p>

      <div class="card">
        <div class="card-head">
          <span class="card-tag">AI SYSTEMS</span>
        </div>
        <div class="card-title">Autonomous AI Agency Platform</div>
        <p class="card-desc">10-agent system handling the full client lifecycle — intake, sales, scoping, build, QA, deploy, support, billing, comms, phone — across 8 project types. MiniMax M2.7 primary; Gemini 3 Flash Preview for visual QA. Voice via Pipecat + Telnyx + Deepgram Nova; agents execute inside Cua sandboxes. SvelteKit client portal on Vercel.</p>
        <div class="card-meta">10 specialized agents · 8 project types · ~15× cost reduction target</div>
      </div>

      <div class="card">
        <div class="card-head">
          <span class="card-tag">AI AT SCALE</span>
        </div>
        <div class="card-title">Reporting Modernization — SCRD / ESR / MPR v2</div>
        <p class="card-desc">JSON-first replacement for three legacy scorecards (~2,300 entities/closeout). Python packagers on Teradata, Step Functions parallel branch, DynamoDB caching, single vanilla-JS viewer. AWS Bedrock (Claude Haiku 4.5) for auto-narratives + per-KPI explanations via <code>/api/v1/kpi-explain</code>. Closed seven latent defects en route, including an <code>eval()</code>-based templating injection.</p>
        <div class="card-meta">~2,300 entities/closeout · 7 defects closed · 13 engineering docs</div>
      </div>

      <p>Want a closer look at either of these? Just ask — <button class="inline-chip" data-prompt="Tell me about your Delta work">the Delta story</button> or <button class="inline-chip" data-prompt="That Simple Tech — the agency thing">the agency platform</button>.</p>
    </template>

    <template id="t-delta">
      <p>I've been at Delta since 2021. Two phases:</p>
      <p><strong>2021–23: Associate Software Developer.</strong> The early-career half — Executive AI Reporting POC, AWS Glue CI/CD work, STS SSO automation pure-bash (worked around Windows Defender + admin restrictions on the corporate fleet).</p>
      <p><strong>2023–present: Data Engineer on the Operations Strategy Reporting (ODSR) team.</strong> The work I'm most known for internally: <em>Reporting Modernization v2</em>. The SCRD / ESR / MPR scorecards were huge PPTX / HTML monoliths — I led the replacement onto a JSON-first stack on AWS-native services (Glue, Step Functions, DynamoDB, S3, API Gateway, Bedrock), with Claude Haiku 4.5 generating auto-narratives and per-KPI explanations.</p>
      <p>The constraint was real: <code>delegate-admin-</code> IAM boundary plus an SCP blocking new Lambda creation. I shipped the AI compute as a <strong>Glue Python-shell job</strong> with custom boto3 packaging so we didn't need an architecture exception.</p>
      <p><strong>June 2026: selected for Delta's AI Enablement Team.</strong> AI agent standards across Operations Planning &amp; Performance. That's the next chapter.</p>
      <div class="msg-actions">
        <button class="chip" data-prompt="What is SCRD?">▸ What's SCRD?</button>
        <button class="chip" data-prompt="Tell me about the eval() injection">▸ The eval() defect story</button>
      </div>
    </template>

    <template id="t-scrd">
      <p>SCRD = Scorecard. It's an internal Delta operational scorecard. The v1 ran as a generated PPTX with per-business-unit slides; v2 is a JSON-first data package + a single vanilla-JS Chart.js viewer. The win wasn't just the renderer — it was making one packager handle <strong>~2,300 organizational entities per monthly close</strong>, with the renderer code surface shrinking enough that Python-heavy teammates could maintain the frontend.</p>
      <p>ESR (Executive Strategy Reporting) and MPR (Monthly Performance Reporting) ride the same pipeline now.</p>
    </template>

    <template id="t-eval">
      <p>While reviewing the legacy SCRD code I found a template renderer using <code>eval()</code> on operator-supplied strings — a templating-injection vector hiding in plain sight. Closed it as part of the v2 migration along with six other latent defects (the worst was swapped year/month columns on one of the rollups, silently miscategorizing closeouts).</p>
      <p>Total: seven defects closed during the modernization, all logged with reproduction steps in the 13 engineering docs.</p>
    </template>

    <template id="t-tst">
      <p><strong>That Simple Tech (TST)</strong> is my AI-native technology consultancy. Sole proprietor / operator. The "headline product" is the <strong>Autonomous AI Agency Platform</strong> — a 10-agent system that handles the full client lifecycle for small-business engagements:</p>

        intake · sales · scoping · build · QA · deploy · support · billing · comms · phone

      <p>Architecture decisions worth flagging:</p>
      <ul>
        <li><strong>MiniMax M2.7</strong> as the primary brain — 100% tool calling, ~3.3× cheaper and ~2.5× faster than the equivalent Claude API path</li>
        <li><strong>Gemini 3 Flash Preview</strong> for visual QA</li>
        <li><strong>Pipecat + Telnyx + Deepgram Nova</strong> for the voice pipeline</li>
        <li><strong>Cua</strong> sandboxes for agent execution</li>
        <li><strong>SvelteKit on Vercel</strong> for the client portal with a unified revision queue (portal / email / SMS / phone all funnel to one inbox)</li>
        <li><strong>Qwen Code on OpenRouter</strong> as the development harness</li>
      </ul>
      <p>Client portals never expose AI terminology — to clients it just looks like a really fast agency. There's a VA review gate (PENDING_REVIEW) on all client-facing output.</p>
    </template>
