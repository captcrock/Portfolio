<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>crockerOS — Adam Crocker, AI Cloud Engineer</title>
    <meta name="description" content="Adam Crocker's portfolio rendered as an operating system. Open apps, run terminal commands, browse files." />
    <meta name="theme-color" content="#0a0d12" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://crockerjadam.com/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <!-- ===== BOOT SCREEN ===== -->
    <div class="boot" id="boot">
      <div class="boot-logo">
        <div class="boot-mark"></div>
        <div class="boot-name">crockerOS</div>
      </div>
      <div class="boot-bar"><div class="boot-fill"></div></div>
      <div class="boot-status" id="boot-status">Initializing kernel…</div>
    </div>

    <!-- ===== DESKTOP ===== -->
    <div class="desktop" id="desktop">
      <!-- menubar -->
      <div class="menubar">
        <div class="mb-left">
          <span class="mb-apple"></span>
          <span class="mb-app">crockerOS</span>
          <span class="mb-menu">File</span>
          <span class="mb-menu">Edit</span>
          <span class="mb-menu">View</span>
          <span class="mb-menu">Window</span>
          <span class="mb-menu">Help</span>
        </div>
        <div class="mb-right">
          <span class="mb-stat" title="Status: AVAILABLE">● online</span>
          <span class="mb-stat">CT</span>
          <span class="mb-stat" id="mb-clock">--:--</span>
          <span class="mb-stat" id="mb-date">---</span>
        </div>
      </div>

      <!-- desktop icons -->
      <div class="dt-icons">
        <button class="dt-icon" data-open="finder">
          <div class="dt-icon-img dt-i-finder"></div>
          <div class="dt-icon-label">projects</div>
        </button>
        <button class="dt-icon" data-open="about">
          <div class="dt-icon-img dt-i-about"></div>
          <div class="dt-icon-label">about.md</div>
        </button>
        <button class="dt-icon" data-open="terminal">
          <div class="dt-icon-img dt-i-terminal"></div>
          <div class="dt-icon-label">Terminal</div>
        </button>
        <button class="dt-icon" data-open="resume">
          <div class="dt-icon-img dt-i-resume"></div>
          <div class="dt-icon-label">resume.pdf</div>
        </button>
      </div>

      <!-- windows mount point -->
      <div class="windows" id="windows"></div>

      <!-- dock -->
      <div class="dock">
        <button class="dock-app" data-open="terminal" title="Terminal">
          <div class="dock-img dt-i-terminal"></div>
        </button>
        <button class="dock-app" data-open="finder" title="Finder — projects">
          <div class="dock-img dt-i-finder"></div>
        </button>
        <button class="dock-app" data-open="about" title="About Me">
          <div class="dock-img dt-i-about"></div>
        </button>
        <button class="dock-app" data-open="stack" title="System — Stack">
          <div class="dock-img dt-i-stack"></div>
        </button>
        <button class="dock-app" data-open="photos" title="Photos">
          <div class="dock-img dt-i-photos"></div>
        </button>
        <button class="dock-app" data-open="mail" title="Mail">
          <div class="dock-img dt-i-mail"></div>
        </button>
        <button class="dock-app" data-open="resume" title="Résumé.pdf">
          <div class="dock-img dt-i-resume"></div>
        </button>
      </div>
    </div>

    <!-- ===== APP TEMPLATES (cloned by JS) ===== -->

    <template id="app-terminal">
      <div class="term">
        <div class="term-tabs">
          <div class="term-tab is-active">adam@crockerOS — bash</div>
        </div>
        <div class="term-body" data-term-body>
          <div class="term-line"><span class="term-ps">adam@crockerOS</span> <span class="term-cwd">~</span> <span class="term-mark">%</span> <span class="term-cmd term-auto">whoami</span></div>
          <div class="term-out">Adam Crocker · AI Cloud Engineer · AWS Solutions Architect — Professional</div>
          <div class="term-out term-mute">Type <code>help</code> for available commands.</div>
        </div>
        <form class="term-input" data-term-input>
          <span class="term-ps">adam@crockerOS</span>
          <span class="term-cwd">~</span>
          <span class="term-mark">%</span>
          <input type="text" autofocus autocomplete="off" spellcheck="false" />
        </form>
      </div>
    </template>

    <template id="app-finder">
      <div class="finder">
        <aside class="fnd-sidebar">
          <div class="fnd-sec-label">Favorites</div>
          <button class="fnd-item is-active" data-folder="projects">
            <span class="fnd-icon">📁</span> projects
          </button>
          <button class="fnd-item" data-folder="documents">
            <span class="fnd-icon">📁</span> documents
          </button>
          <div class="fnd-sec-label">Mounted</div>
          <div class="fnd-item static">
            <span class="fnd-icon">💾</span> aws://949220898418
          </div>
          <div class="fnd-item static">
            <span class="fnd-icon">🌐</span> crockerjadam.com
          </div>
        </aside>
        <div class="fnd-main">
          <div class="fnd-toolbar">
            <span class="fnd-path">projects /</span>
            <span class="fnd-count">6 items</span>
          </div>
          <div class="fnd-grid" data-fnd-grid></div>
        </div>
      </div>
    </template>

    <template id="app-about">
      <div class="doc">
        <div class="doc-head">
          <span class="doc-tab is-active">about.md</span>
        </div>
        <div class="doc-body">
          <h1># Adam Crocker</h1>
          <p class="doc-sub">AI Cloud Engineer · AWS Solutions Architect — Professional</p>
          <p>I build <em>AI-native systems for businesses of every size</em>. Fortune 500 down to mom-and-pop shops. Same person, same care.</p>

          <h2>## Roles</h2>
          <ul>
            <li><strong>Delta Air Lines</strong> · Data Engineer on the Operations Strategy Reporting (ODSR) team. <em>Moving to Delta's AI Enablement team in June 2026.</em></li>
            <li><strong>Diversified Gas &amp; Oil</strong> · Systems Engineer (concurrent role since Aug 2025).</li>
            <li><strong>That Simple Tech</strong> · founder + operator. AI-native consultancy.</li>
          </ul>

          <h2>## Credential</h2>
          <p><strong>AWS Certified Solutions Architect — Professional.</strong> Earned Jan 2025, valid through Jan 2028.</p>

          <h2>## Trajectory</h2>
          <table class="doc-table">
            <tr><th>2021</th><td>TrueCoders · Full-Stack Software Engineering · Birmingham, AL</td></tr>
            <tr><th>2021 — 23</th><td>Delta Air Lines · Associate Software Developer</td></tr>
            <tr><th>2023 — 26</th><td>Delta Air Lines · Data Engineer · ODSR</td></tr>
            <tr><th>Jan 2025</th><td><strong>AWS Solutions Architect — Professional</strong></td></tr>
            <tr><th>Aug 2025</th><td>Diversified Gas &amp; Oil · Systems Engineer</td></tr>
            <tr><th>Jun 2026</th><td>Delta AI Enablement Team — incoming</td></tr>
          </table>

          <h2>## Base</h2>
          <p>Springville · Alabama · US. Remote anywhere. CT time zone.</p>
        </div>
      </div>
    </template>

    <template id="app-stack">
      <div class="sysprefs">
        <div class="sp-head">System / Capabilities</div>
        <div class="sp-grid">
          <div class="sp-tile">
            <div class="sp-tile-icon">🧠</div>
            <div class="sp-tile-h">AI / ML</div>
            <div class="sp-tile-body">Agent orchestration · MCP · Claude/OpenAI/OpenRouter · Bedrock (Anthropic, Titan, Cohere, Voyage) · pgai · RAG · vLLM · Ollama · Qwen 3.6+ · MiniMax M2.7 · DeepSeek-R1 · Pipecat · Deepgram · Cua · Isolation Forest · Random Forest · LSTM</div>
          </div>
          <div class="sp-tile">
            <div class="sp-tile-icon">☁️</div>
            <div class="sp-tile-h">AWS</div>
            <div class="sp-tile-body">Lambda · Step Functions · EventBridge · SageMaker · Bedrock · Amplify · AppSync · Cognito · API Gateway · S3 · DynamoDB · Redshift · Glue · Kinesis · Fargate · ECR · CDK (Py+TS) · CloudFormation · Secrets · IAM · STS · KMS</div>
          </div>
          <div class="sp-tile">
            <div class="sp-tile-icon">🗄️</div>
            <div class="sp-tile-h">Data &amp; ETL</div>
            <div class="sp-tile-body">TimescaleDB · hypertables · continuous aggregates · PostgreSQL · PL/pgSQL · Teradata · Snowflake · Redshift · pgvector · pgai · star-schema · effective-dated dims · CygNet SCADA · MNR</div>
          </div>
          <div class="sp-tile">
            <div class="sp-tile-icon">🎛️</div>
            <div class="sp-tile-h">App Stack</div>
            <div class="sp-tile-body">FastAPI · Node · GraphQL · SQLAlchemy 2 · Pydantic · Alembic · SvelteKit 2 / Svelte 5 · React · Angular 20 · Ionic 8 · Capacitor · PWA · Tailwind · Three.js · Threlte · GSAP · Dexie / IndexedDB</div>
          </div>
          <div class="sp-tile">
            <div class="sp-tile-icon">🛠️</div>
            <div class="sp-tile-h">DevOps</div>
            <div class="sp-tile-body">Azure DevOps Pipelines · GitLab CI/CD · GitHub Actions · CDK · CloudFormation · Docker · self-hosted build agents · pattern-based SQL risk classification · SOX-aligned audit logging · Tailscale · Caddy · Grafana / Prometheus</div>
          </div>
          <div class="sp-tile">
            <div class="sp-tile-icon">⌨️</div>
            <div class="sp-tile-h">Languages &amp; Identity</div>
            <div class="sp-tile-body">Python · TypeScript · JavaScript · SQL · PL/pgSQL · Bash · PowerShell · HTML · CSS · Entra ID / Azure AD · MSAL · Cognito · PingFederate · Stripe · Telnyx · GA4 · GSC</div>
          </div>
        </div>
      </div>
    </template>

    <template id="app-photos">
      <div class="photos">
        <picture>
          <source type="image/webp" srcset="/assets/portrait.webp 1x, /assets/portrait@2x.webp 2x" />
          <img src="/assets/portrait.jpg" alt="Adam Crocker" />
        </picture>
        <div class="photos-meta">
          <div class="ph-name">Adam Crocker</div>
          <div class="ph-loc">Birmingham, AL · 2025</div>
        </div>
      </div>
    </template>

    <template id="app-mail">
      <div class="mail">
        <div class="mail-tab">New Message</div>
        <div class="mail-fields">
          <div class="mail-row"><span class="mail-k">To:</span><span class="mail-v">crocker.j.adam@gmail.com</span></div>
          <div class="mail-row"><span class="mail-k">From:</span><input type="email" placeholder="your-email@domain.com" /></div>
          <div class="mail-row"><span class="mail-k">Subject:</span><input type="text" placeholder="Hi Adam — quick question about your portfolio" value="Saw your portfolio" /></div>
        </div>
        <textarea class="mail-body">Hi Adam,

I came across your portfolio and wanted to reach out about

[your message here]

Best,
</textarea>
        <div class="mail-actions">
          <a class="mail-send" href="mailto:crocker.j.adam@gmail.com?subject=Saw%20your%20portfolio">
            Send via mail client →
          </a>
          <span class="mail-tip">Opens your default mail app. Or copy:&nbsp; <code>crocker.j.adam@gmail.com</code></span>
        </div>
      </div>
    </template>

    <template id="app-resume">
      <div class="pdf-host">
        <div class="pdf-bar">
          <span>Adam_Crocker_Resume.pdf</span>
          <a class="pdf-dl" href="/assets/Adam_Crocker_Resume.pdf" download="Adam_Crocker_Resume.pdf">Download ↓</a>
        </div>
        <iframe src="/assets/Adam_Crocker_Resume.pdf#zoom=page-width" title="Résumé"></iframe>
      </div>
    </template>

    <template id="app-project">
      <div class="proj">
        <div class="proj-head">
          <div class="proj-meta">
            <span class="proj-tag" data-tag></span>
            <span class="proj-org" data-org></span>
          </div>
          <h1 class="proj-title" data-title></h1>
        </div>
        <div class="proj-body">
          <p class="proj-desc" data-desc></p>
          <div class="proj-stats" data-stats></div>
          <div class="proj-chips" data-chips></div>
        </div>
      </div>
    </template>

    <script src="/assets/main.js" defer></script>
  </body>
</html>
